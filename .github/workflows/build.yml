name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
  KEY_ALIAS: callbridge

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # Doimiy imzo kaliti bo'lsa — release build. Bo'lmasa debug build.
      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Build APK
        run: |
          if [ -f release.keystore ]; then
            echo "Imzolangan release build"
            gradle assembleRelease --no-daemon --stacktrace
            cp app/build/outputs/apk/release/app-release.apk call-bridge.apk
          else
            echo "Keystore yo'q — debug build"
            gradle assembleDebug --no-daemon --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk call-bridge.apk
          fi

      - name: Show APK info
        run: |
          ls -la call-bridge.apk
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs call-bridge.apk | head -5 || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: call-bridge-apk
          path: call-bridge.apk
          if-no-files-found: error

      # Doimiy, login talab qilmaydigan yuklab olish havolasi:
      # https://github.com/<owner>/<repo>/releases/latest/download/call-bridge.apk
      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest call-bridge.apk \
            --title "Call Bridge — oxirgi build" \
            --notes "Commit: ${{ github.sha }}"
