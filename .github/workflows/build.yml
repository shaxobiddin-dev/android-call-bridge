name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk call-bridge.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: call-bridge-apk
          path: call-bridge.apk
          if-no-files-found: error

      # Doimiy, login talab qilmaydigan yuklab olish havolasi:
      # https://github.com/<owner>/<repo>/releases/latest/download/call-bridge.apk
      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest call-bridge.apk \
            --title "Call Bridge — oxirgi build" \
            --notes "Commit: ${{ github.sha }}"
